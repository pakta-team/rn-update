# [INPUT]: 依赖 Expo57 样例锁、本轮 SDK 原生源码、插件及平台工具链
# [OUTPUT]: 对外提供 Android/iOS Expo Release 编译检查与失败构建日志
# [POS]: Expo Modules 消费端门禁；独立于 bare RN E2E，不证明设备更新或 npm 候选验收
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: expo-build

on:
  pull_request:
    paths: &expo-paths
      - '.github/workflows/expo_build.yml'
      - '.gitmodules'
      - 'rn-update/package.json'
      - 'rn-update/rn-update.podspec'
      - 'rn-update/react-native.config.js'
      - 'rn-update/expo-module.config.json'
      - 'rn-update/app.plugin.js'
      - 'rn-update/check-expo-version.js'
      - 'rn-update/src/**'
      - 'rn-update/ios/**'
      - 'rn-update/android/**'
      - 'rn-update/cpp/**'
      - 'rn-update/Example/expoUsePakta/**'
  push:
    branches: [master, main, 'codex/verify-*']
    paths: *expo-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: rn-update/Example/expoUsePakta

jobs:
  expo-build:
    name: Expo Release (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Set up Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'
      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Expo example dependencies
        run: bun install --frozen-lockfile
      - name: Link the current SDK without its development dependencies
        # 隔离副本位于消费端内，原生解析沿宿主 node_modules 找 Expo/RN，避免根 RN0.73 污染。
        # 不运行 SDK install/prepack；这是源码集成编译，不冒充发布候选消费。
        run: |
          set -euo pipefail
          sdk="$GITHUB_WORKSPACE/rn-update"
          local_sdk="$PWD/.expo-ci/local-rn-update"
          mkdir -p "$local_sdk"
          cp "$sdk"/package.json "$sdk"/rn-update.podspec "$sdk"/react-native.config.js \
            "$sdk"/expo-module.config.json "$sdk"/app.plugin.js "$sdk"/check-expo-version.js "$local_sdk/"
          rsync -a --exclude='.git' "$sdk/src" "$sdk/ios" "$sdk/android" "$sdk/cpp" "$local_sdk/"
          rm -rf node_modules/rn-update
          ln -s ../.expo-ci/local-rn-update node_modules/rn-update
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync('node_modules/rn-update');
          assert.equal(root, fs.realpathSync('.expo-ci/local-rn-update'));
          for (const name of ['react-native', 'expo']) {
            const host = fs.realpathSync(require.resolve(`${name}/package.json`));
            const linked = fs.realpathSync(require.resolve(`${name}/package.json`, {paths: [root]}));
            assert.equal(linked, host, `${name} must resolve from the consumer`);
          }
          for (const file of ['src/NativePakta.ts', 'app.plugin.js', 'expo-module.config.json', 'rn-update.podspec']) {
            assert.deepEqual(fs.readFileSync(path.join(root, file)), fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'rn-update', file)));
          }
          NODE
      - name: Generate the Android project
        if: matrix.platform == 'android'
        run: CI=1 bunx expo prebuild --platform android --no-install
      - name: Build Android Release
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain | tee ../android-build.log
      - name: Generate the iOS project
        if: matrix.platform == 'ios'
        run: CI=1 bunx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        if: matrix.platform == 'ios'
        env:
          LANG: en_US.UTF-8
          RCT_NEW_ARCH_ENABLED: '1'
        run: cd ios && pod install
      - name: Assert the Expo Apple integration was selected
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          grep -F 'rn-update/Expo' ios/Podfile.lock
          grep -F 'EXPO_SUPPORTS_BUNDLEURL' 'ios/Pods/Target Support Files/rn-update/rn-update.release.xcconfig'
          grep -F 'ExpoPaktaReactDelegateHandler' 'ios/Pods/Target Support Files/Pods-expoUsePakta/ExpoModulesProvider.swift'
      - name: Build iOS Release for simulator
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          cd ios
          xcodebuild -workspace expoUsePakta.xcworkspace -scheme expoUsePakta \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build | tee ../ios-build.log
      - name: Preserve failing build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: expo-build-logs-${{ matrix.platform }}
          path: |
            rn-update/Example/expoUsePakta/*-build.log
            rn-update/Example/expoUsePakta/android/build/reports/
          retention-days: 7
          if-no-files-found: ignore
