# [INPUT]: 依赖显式 Git tag、独立 SDK package.json、Harmony 元数据与 Android 原生构建环境
# [OUTPUT]: 同步版本与原生产物后仅打包一次，校验和消费同一 tgz，再核对摘要发布
# [POS]: 独立公开 SDK 的 tag 发布边界，版本同步在 HAR 构建前，同一候选发布成功后创建 GitHub Release
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Publish Package to npmjs

defaults:
  run:
    working-directory: .
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to publish, for example v1.2.0
        required: true
        type: string

env:
  RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}

permissions:
  id-token: write  # Required for OIDC
  contents: read

concurrency:
  group: npm-publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Validate the existing release tag and SDK/HAR version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git show-ref --verify "refs/tags/$RELEASE_VERSION"
          node scripts/release-version.js "$RELEASE_VERSION"
      - name: Install frozen dependencies and run SDK checks
        run: bun install --frozen-lockfile && bun run lint && bun run test

  check_changes:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      harmony_changed: ${{ steps.check.outputs.changed }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check Harmony changes
        id: check
        shell: bash
        run: |
          # The baseline has to be the newest ancestor tag that actually made it
          # to npm, not merely the newest tag: a tag whose publish run failed
          # (v10.52.2 died in prepack) exists in git but not on the registry, and
          # "Fetch previous Harmony HAR" pulls that version's tarball from npm.
          # Picking it would fail the whole publish on ETARGET.
          PREV_TAG=""
          for tag in $(git tag --sort=-v:refname --merged HEAD^ | head -20); do
            case "$tag" in v[0-9]*) ;; *) continue ;; esac
            if npm view "rn-update@${tag#v}" version >/dev/null 2>&1; then
              PREV_TAG="$tag"
              break
            fi
            echo "Skipping $tag: tagged but never published to npm."
          done
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          if [ -z "$PREV_TAG" ]; then
            echo "No previous published tag found, assuming harmony changed."
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Previous tag is $PREV_TAG"
          if ! git diff --quiet --ignore-submodules=none "$PREV_TAG" HEAD -- \
            ':(top)harmony' ':(top)cpp' \
            ':(top)android/jni' ':(top)package.json' \
            ':(top)bun.lock' ':(top).gitmodules' \
            ':(top)scripts/build-harmony-har.js' \
            ':(top)scripts/release-version.js' \
            ':(top)scripts/check-harmony-har.py' \
            ':(top)scripts/prepare-release.js' \
            ':(top)scripts/package-candidate.js' \
            ':(top).github/workflows/publish.yml'; then
            echo "Harmony build inputs changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Harmony build inputs have NO changes."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  # Rebuild the Android native libraries from source so the published package
  # can never ship a stale librnupdate.so after a cpp/patch_core change (the
  # committed binaries are for local dev / git installs only).
  build_android_so:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep in sync with PINNED_NDK_VERSION in scripts/build-android-so.sh.
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pinned NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - name: Build and verify native libraries
        # The runner image presets ANDROID_NDK_HOME/ANDROID_NDK_ROOT to its
        # bundled NDK, which would win over the pinned install in the script's
        # resolution order — force the pinned one so published .so files don't
        # drift with runner image upgrades.
        run: |
          rm -rf android/lib android/obj
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bash scripts/build-android-so.sh
      - name: Test rebuilt Android binary strings and native library negative controls
        run: node --test scripts/check-binary-strings.test.js scripts/verify-android-so.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: android-so
          path: android/lib/
          if-no-files-found: error

  publish_with_harmony:
    needs: [check_changes, build_android_so]
    if: needs.check_changes.outputs.harmony_changed == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
          submodules: recursive
      - name: Configure git safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule foreach --recursive 'git config --global --add safe.directory "$toplevel/$sm_path"'
      - uses: oven-sh/setup-bun@v2
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install the HAR verifier runtime in the build container
        run: apt-get update && apt-get install -y python3
      - run: bun install --frozen-lockfile
      - name: Synchronize release metadata
        run: node scripts/release-version.js "$RELEASE_VERSION"
      # Drop the committed binaries first: the artifact must fully replace
      # android/lib, so any layout regression makes the verify step fail loudly
      # instead of silently passing against stale committed .so files.
      - name: Remove committed Android native libraries
        run: rm -rf android/lib
      - name: Use CI-built Android native libraries
        uses: actions/download-artifact@v8
        with:
          name: android-so
          path: android/lib
      - name: Verify Android native libraries
        run: node scripts/verify-android-so.js
      - name: Build Harmony HAR
        run: npm run build:harmony-har -- --build-mode release
      - name: Verify Harmony HAR artifact
        run: python3 -B scripts/check-harmony-har.py harmony/pakta.har
      - name: Test real Release HAR and BuildProfile negative controls
        run: |
          python3 -B scripts/test-harmony-har.py --har harmony/pakta.har -v
          python3 -B scripts/test-binary-strings-har.py --har harmony/pakta.har -v
      - name: Prepare and consume release candidate
        id: candidate
        run: bun run release:prepare
      - name: Publish to npm
        shell: bash
        env:
          CANDIDATE_TGZ: ${{ steps.candidate.outputs.tarball }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$CANDIDATE_TGZ" | sha256sum --check --strict
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish "$CANDIDATE_TGZ" --provenance --access public --tag beta
          else
            npm publish "$CANDIDATE_TGZ" --provenance --access public
          fi

  publish_without_harmony:
    needs: [check_changes, build_android_so]
    if: needs.check_changes.outputs.harmony_changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
          submodules: recursive
      - name: Configure git safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule foreach --recursive 'git config --global --add safe.directory "$toplevel/$sm_path"'
      - uses: oven-sh/setup-bun@v2
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - name: Synchronize release metadata
        run: node scripts/release-version.js "$RELEASE_VERSION"
      # Drop the committed binaries first: the artifact must fully replace
      # android/lib, so any layout regression makes the verify step fail loudly
      # instead of silently passing against stale committed .so files.
      - name: Remove committed Android native libraries
        run: rm -rf android/lib
      - name: Use CI-built Android native libraries
        uses: actions/download-artifact@v8
        with:
          name: android-so
          path: android/lib
      - name: Verify Android native libraries
        run: node scripts/verify-android-so.js
      # Fail closed: the package must always ship harmony/pakta.har
      # (.npmignore explicitly whitelists it). If the previous release can't
      # be fetched, fix the cause or re-run — never publish a HAR-less package.
      - name: Fetch previous Harmony HAR
        shell: bash
        run: |
          PREV_VERSION="${{ needs.check_changes.outputs.prev_tag }}"
          PREV_VERSION="${PREV_VERSION#v}"
          echo "Fetching harmony/pakta.har from rn-update@$PREV_VERSION"
          npm pack "rn-update@$PREV_VERSION"
          tar -xzf "rn-update-${PREV_VERSION}.tgz" package/harmony/pakta.har
          mkdir -p harmony
          cp package/harmony/pakta.har harmony/pakta.har
          # Clean up temporary pack and extraction files to prevent publishing them
          rm -rf "rn-update-${PREV_VERSION}.tgz" package
      - name: Verify Harmony HAR artifact
        env:
          PREV_TAG: ${{ needs.check_changes.outputs.prev_tag }}
        run: python3 -B scripts/check-harmony-har.py harmony/pakta.har --version "${PREV_TAG#v}"
      - name: Prepare and consume release candidate
        id: candidate
        env:
          PREV_TAG: ${{ needs.check_changes.outputs.prev_tag }}
        run: EXPECTED_HAR_VERSION="${PREV_TAG#v}" bun run release:prepare
      - name: Publish to npm
        shell: bash
        env:
          CANDIDATE_TGZ: ${{ steps.candidate.outputs.tarball }}
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$CANDIDATE_TGZ" | sha256sum --check --strict
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish "$CANDIDATE_TGZ" --provenance --access public --tag beta
          else
            npm publish "$CANDIDATE_TGZ" --provenance --access public
          fi

  create_release:
    needs: [publish_with_harmony, publish_without_harmony]
    if: always() && (needs.publish_with_harmony.result == 'success' || needs.publish_without_harmony.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release after the checked package was published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists; reusing it"
            exit 0
          fi
          arguments=(--verify-tag --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" "${arguments[@]}"
