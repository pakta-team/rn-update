# [INPUT]: 依赖显式 Harmony runner、进程级 Git LF 检出设置、候选/HAR、DevEco、外部签名和指定 HDC 目标
# [OUTPUT]: 保留 macOS 手动矩阵，提供专用验证分支的 Windows 双 ABI Release/真实差分/设备链
# [POS]: Harmony 运行编排；Windows 只在独立 source checkout 和全新短工程执行，不覆写本机主仓库
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
#
# 需要一台自托管 runner（labels: self-hosted, macOS, harmony），机器上需一次性准备：
#   - DevEco Studio + SDK（hdc 在 PATH，默认 DEVECO_HOME=/Applications/DevEco-Studio.app/Contents）
#   - 已部署的模拟器镜像（默认 hvd 名 api20；DevEco 内登录华为账号下载）或常连真机
#   - ~/.ohos/config 下 bundleName 对应的自动签名材料（调试证书约一年续签一次）
#   - node 22+ / bun / rsync
# GitHub 托管 runner 跑不了：Linux 无鸿蒙模拟器；macOS/Windows runner 无嵌套虚拟化，
# 且模拟器镜像需华为账号在 DevEco 内下载，无法在临时环境自动供给。
name: e2e-harmony

defaults:
  run:
    working-directory: rn-update

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Harmony runner platform
        type: choice
        options: [macos, windows]
        default: macos
  push:
    branches:
      - codex/verify-harmony-win-20261115
    paths:
      - .github/workflows/e2e_harmony.yml
      - .github/workflows/scripts/run-harmony-windows-ci.ps1
      - rn-update/**
      - rn-update-cli/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-harmony:
    if: github.event_name == 'workflow_dispatch' && inputs.runner != 'windows'
    runs-on: [self-hosted, macOS, harmony]
    timeout-minutes: 40
    env:
      RNU_CLI_ROOT: ${{ github.workspace }}/rn-update-cli
      RNU_HARMONY_BUNDLE_NAME: com.charmlot.testpakta
      HVD_NAME: api20
    steps:
      - name: Checkout rn-update
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install e2etest dependencies
        run: cd Example/e2etest && bun install --frozen-lockfile

      - name: Install harmony_use_pakta dependencies
        run: cd Example/harmony_use_pakta && bun install --frozen-lockfile

      - name: Install rn-update-cli dependencies
        run: cd ../rn-update-cli && bun install --frozen-lockfile && bun run build

      - name: Start emulator if no device connected
        run: |
          set -euo pipefail
          if hdc list targets | grep -qv '^\[Empty\]$'; then
            echo "device already connected"; exit 0
          fi
          DEVECO_HOME="${DEVECO_HOME:-/Applications/DevEco-Studio.app/Contents}"
          # 实例 config.ini 的 sdkPath 可能失效，必须显式传 -imageRoot；
          # nohup 脱离 job 进程组，避免 step 结束时模拟器被收尾杀掉。
          nohup "$DEVECO_HOME/tools/emulator/Emulator" \
            -hvd "$HVD_NAME" \
            -path "$HOME/.Huawei/Emulator/deployed" \
            -imageRoot "$HOME/Library/Huawei/Sdk" \
            > emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if hdc list targets | grep -qv '^\[Empty\]$'; then
              echo "emulator online"; exit 0
            fi
            sleep 5
          done
          echo "emulator did not come online in 300s" >&2
          tail -50 emulator.log >&2 || true
          exit 1

      - name: Build and install e2e base hap
        run: bash Example/e2etest/scripts/build-harmony-e2e.sh

      - name: Run harmony e2e
        env:
          RNU_E2E_SKIP_PREPARE: 'true'
        run: cd Example/e2etest && npx jest --config e2e/harmony.jest.config.js

      - name: Collect failure diagnostics
        # cancelled() 覆盖 job 超时被杀的场景,否则超时时拿不到现场
        if: failure() || cancelled()
        run: |
          set +e
          mkdir -p harmony-diagnostics
          hdc shell snapshot_display -f /data/local/tmp/e2e-fail.jpeg
          hdc file recv /data/local/tmp/e2e-fail.jpeg harmony-diagnostics/screen.jpeg
          hdc shell uitest dumpLayout -p /data/local/tmp/e2e-fail-layout.json
          hdc file recv /data/local/tmp/e2e-fail-layout.json harmony-diagnostics/layout.json
          hdc shell hilog -x | tail -2000 > harmony-diagnostics/hilog.txt
          cp emulator.log harmony-diagnostics/ 2>/dev/null
          true

      - name: Upload failure diagnostics
        # cancelled() 覆盖 job 超时被杀的场景,否则超时时拿不到现场
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: harmony-e2e-diagnostics
          path: rn-update/harmony-diagnostics/
          if-no-files-found: ignore

      - name: Cleanup local e2e server
        if: always()
        run: |
          kill "$(cat Example/e2etest/.e2e-artifacts/.server.harmony.pid 2>/dev/null)" 2>/dev/null || true

  e2e-harmony-windows:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/verify-harmony-win-20261115') || (github.event_name == 'workflow_dispatch' && inputs.runner == 'windows')
    runs-on: [self-hosted, Windows, X64, pakta-harmony-20261115]
    timeout-minutes: 90
    concurrency:
      group: pakta-harmony-20261115-device
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: source/rn-update
    env:
      # 仅覆盖本 job 的 Git 配置，子模块继承；不写 self-hosted 用户全局配置。
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      RNU_HARMONY_SDK_SHA256: b5ed311d93edb83564357369a10dab59608012351bade92f6125cc6ac55de237
      RNU_HARMONY_HAR_SHA256: ee0d33ebd0a469e889279943d4ad69ba4a3ad0b29e7a00a71839382c3f3146a8
    steps:
      - name: Checkout isolated validation source
        uses: actions/checkout@v7
        with:
          path: source
          submodules: recursive

      - name: Validate explicit Windows inputs without mutation
        run: '& ../.github/workflows/scripts/run-harmony-windows-ci.ps1 -PlanOnly'

      - name: Run real Harmony candidate and device phases
        run: '& ../.github/workflows/scripts/run-harmony-windows-ci.ps1'

      - name: Preserve explicit validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harmony-windows-20261115-evidence
          path: |
            source/rn-update/Example/e2etest/.e2e-artifacts/harmony-ci/*.json
            source/rn-update/Example/e2etest/.e2e-artifacts/harmony-ci/*.log
            source/rn-update/Example/e2etest/.e2e-artifacts/harmony/*.json
            source/rn-update/Example/e2etest/.e2e-artifacts/server.log
          if-no-files-found: warn
          retention-days: 7
